# Publishes @banklink/sdk to npm with provenance, using npm trusted publishing (OIDC):
# no npm token is stored anywhere. One-time setup on npmjs.com, package @banklink/sdk →
# Settings → Trusted publishing: GitHub Actions, repo aurvex-labs/banklink-node,
# workflow publish.yml, environment npm.
#
# Run it by publishing a GitHub release for the tag that matches package.json's version.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2
      - name: Tag matches package.json
        if: github.event_name == 'release'
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
